# Builds a release when you push a version tag, e.g.
#   git tag v0.2.0 && git push origin v0.2.0
# It makes one `am` that runs on both Apple Silicon and Intel Macs and
# attaches it to a GitHub release, ready for Homebrew.
name: release

on:
  push:
    tags: ["v*"]

# Needed to create the release and upload the file.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Tag must match the version in Cargo.toml
        run: |
          want="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml ($want)"; exit 1
          fi

      - name: Test
        run: cargo test

      - name: Build for Apple Silicon and Intel, then join them
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output am \
            target/aarch64-apple-darwin/release/am \
            target/x86_64-apple-darwin/release/am
          # Ad-hoc signature: Apple Silicon refuses to run unsigned code.
          codesign --force --sign - am
          ./am --version

      - name: Package
        run: |
          name="am-${GITHUB_REF_NAME}-macos-universal.tar.gz"
          tar czf "$name" am README.md LICENSE config.example.toml
          shasum -a 256 "$name" | tee "$name.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" \
            --title "am $GITHUB_REF_NAME" --generate-notes
